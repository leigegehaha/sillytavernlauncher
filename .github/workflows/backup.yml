name: 全量备份

on:
  schedule:
    - cron: '0 16 * * *'   # 北京时间每天 0:00
  workflow_dispatch:         # 手动触发

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 SSH 客户端
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: 导出 MySQL 数据库
        run: |
          sshpass -p "${{ secrets.SSH_PASS }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mysqldump -u${{ secrets.MYSQL_USER }} -p${{ secrets.MYSQL_PASS }} ${{ secrets.MYSQL_DB }} | gzip" \
            > backup-db.sql.gz

      - name: 打包站点文件
        run: |
          sshpass -p "${{ secrets.SSH_PASS }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "tar -czf - -C ${{ secrets.SITE_PATH }} ." \
            > backup-site.tar.gz

      - name: 创建备份归档
        run: |
          mkdir -p backup
          cp backup-db.sql.gz backup/
          cp backup-site.tar.gz backup/
          tar -czf backup-$(date +%Y%m%d).tar.gz backup/

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: backup
          name: "站点全量备份 — $(date +%Y-%m-%d)"
          body: "数据库 + 站点文件全量备份"
          files: backup-*.tar.gz
          prerelease: false
          make_latest: true

      - name: 清理旧备份（保留最近 7 个）
        uses: dev-drprasad/delete-older-releases@v0
        with:
          keep_latest: 7
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
