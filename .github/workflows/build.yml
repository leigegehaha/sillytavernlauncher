name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SILLYTAVERN_VERSION: "1.18.0"
  NODE_VERSION: "22.12.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
            node_os: darwin
            node_arch: arm64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
            node_os: darwin
            node_arch: x64
          - platform: windows-latest
            args: ''
            node_os: win
            node_arch: x64
          - platform: ubuntu-22.04
            args: ''
            node_os: linux
            node_arch: x64
            deps: libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.deps }}

      - name: Install frontend dependencies
        run: bun install

      - name: Sync version
        run: bun run sync-version

      - name: Download SillyTavern source
        shell: bash
        env:
          ST_VER: ${{ env.SILLYTAVERN_VERSION }}
        run: |
          echo "📥 Downloading SillyTavern ${ST_VER}..."
          ST_URL="https://github.com/SillyTavern/SillyTavern/archive/refs/tags/${ST_VER}.zip"
          ST_ZIP="/tmp/sillytavern-${ST_VER}.zip"

          # Try multiple mirrors — CI runners are outside China, direct GitHub first
          for mirror in "" "https://ghfast.top/" "https://gh.llkk.cc/"; do
            URL="${mirror}${ST_URL}"
            echo "  Trying: ${URL}"
            if curl -fsSL -o "${ST_ZIP}" "${URL}" --connect-timeout 30 --max-time 600; then
              echo "  ✅ Downloaded successfully"
              break
            fi
            echo "  ❌ Failed, trying next mirror..."
          done

          if [ ! -f "${ST_ZIP}" ] || [ ! -s "${ST_ZIP}" ]; then
            echo "⚠️ SillyTavern download failed, creating placeholder"
            mkdir -p src-tauri/resources/sillytavern-${ST_VER}
            exit 0
          fi

          # Extract: the zip contains SillyTavern-1.18.0/ top-level dir (capital S, T)
          echo "📦 Extracting SillyTavern..."
          ST_RESOURCE="src-tauri/resources/sillytavern-${ST_VER}"
          mkdir -p src-tauri/resources/tmp-st
          
          # Use unzip for all platforms (available in Git Bash on Windows)
          unzip -qo "${ST_ZIP}" -d src-tauri/resources/tmp-st/

          # Rename SillyTavern-1.18.0 → sillytavern-1.18.0
          if [ -d "src-tauri/resources/tmp-st/SillyTavern-${ST_VER}" ]; then
            mv "src-tauri/resources/tmp-st/SillyTavern-${ST_VER}" "${ST_RESOURCE}"
            rmdir src-tauri/resources/tmp-st
          else
            echo "⚠️ Expected SillyTavern-${ST_VER} not found, checking..."
            ls src-tauri/resources/tmp-st/
            EXTRACTED=$(find src-tauri/resources/tmp-st -maxdepth 1 -type d | tail -1)
            if [ -n "${EXTRACTED}" ]; then
              mv "${EXTRACTED}" "${ST_RESOURCE}"
              rmdir src-tauri/resources/tmp-st 2>/dev/null || true
            fi
          fi

          # Remove node_modules if present (will be installed on first launch)
          rm -rf "${ST_RESOURCE}/node_modules" 2>/dev/null || true

          # Verify extraction
          if [ -f "${ST_RESOURCE}/server.js" ]; then
            echo "✅ SillyTavern extracted successfully (server.js found)"
            echo "   Size: $(du -sh ${ST_RESOURCE} 2>/dev/null | cut -f1)"
          else
            echo "⚠️ Extraction may have failed (server.js not found), checking structure..."
            ls -la "${ST_RESOURCE}/" 2>/dev/null || echo "   Directory not found!"
          fi

      - name: Download Node.js binary
        shell: bash
        env:
          NODE_VER: ${{ env.NODE_VERSION }}
          NODE_OS: ${{ matrix.node_os }}
          NODE_ARCH: ${{ matrix.node_arch }}
        run: |
          echo "📥 Downloading Node.js v${NODE_VER} for ${NODE_OS}-${NODE_ARCH}..."

          # Determine filename
          if [[ "${NODE_OS}" == "win" ]]; then
            NODE_FILENAME="node-v${NODE_VER}-${NODE_OS}-${NODE_ARCH}.zip"
          else
            NODE_FILENAME="node-v${NODE_VER}-${NODE_OS}-${NODE_ARCH}.tar.gz"
          fi

          NODE_EXTRACT_DIR="node-v${NODE_VER}-${NODE_OS}-${NODE_ARCH}"
          NODE_RESOURCE="src-tauri/resources/node"
          NODE_ZIP="/tmp/${NODE_FILENAME}"

          # Try multiple mirrors
          for mirror in \
            "https://npmmirror.com/mirrors/node/v${NODE_VER}" \
            "https://mirrors.aliyun.com/nodejs-release/v${NODE_VER}" \
            "https://nodejs.org/dist/v${NODE_VER}"; do
            URL="${mirror}/${NODE_FILENAME}"
            echo "  Trying: ${URL}"
            if curl -fsSL -o "${NODE_ZIP}" "${URL}" --connect-timeout 30 --max-time 600; then
              echo "  ✅ Downloaded successfully ($(du -sh ${NODE_ZIP} | cut -f1))"
              break
            fi
            echo "  ❌ Failed, trying next mirror..."
          done

          if [ ! -f "${NODE_ZIP}" ] || [ ! -s "${NODE_ZIP}" ]; then
            echo "⚠️ Node.js download failed, app will prompt user to install on first launch"
            mkdir -p "${NODE_RESOURCE}"
            exit 0
          fi

          # Extract to a temp location first, then rename to unified "node"
          echo "📦 Extracting Node.js..."
          mkdir -p src-tauri/resources/tmp-node

          if [[ "${NODE_OS}" == "win" ]]; then
            # Use unzip for Windows zip (available in Git Bash)
            unzip -qo "${NODE_ZIP}" -d src-tauri/resources/tmp-node/
          else
            tar xzf "${NODE_ZIP}" -C src-tauri/resources/tmp-node/
          fi

          # The archive extracts as node-v22.12.0-xxx/ top-level dir
          # Rename it to just "node" for consistent resource mapping
          if [ -d "src-tauri/resources/tmp-node/${NODE_EXTRACT_DIR}" ]; then
            mv "src-tauri/resources/tmp-node/${NODE_EXTRACT_DIR}" "${NODE_RESOURCE}"
            rmdir src-tauri/resources/tmp-node
          else
            echo "⚠️ Expected directory not found, listing contents..."
            ls -la src-tauri/resources/tmp-node/
            # Try to find the extracted directory
            EXTRACTED=$(find src-tauri/resources/tmp-node -maxdepth 1 -type d | tail -1)
            if [ -n "${EXTRACTED}" ] && [ -d "${EXTRACTED}" ]; then
              mv "${EXTRACTED}" "${NODE_RESOURCE}"
              rmdir src-tauri/resources/tmp-node 2>/dev/null || true
            fi
          fi

          # Verify extraction
          if [[ "${NODE_OS}" == "win" ]]; then
            NODE_BIN="${NODE_RESOURCE}/node.exe"
          else
            NODE_BIN="${NODE_RESOURCE}/bin/node"
          fi

          if [ -f "${NODE_BIN}" ]; then
            echo "✅ Node.js extracted successfully (node binary found)"
            chmod +x "${NODE_BIN}" 2>/dev/null || true
            echo "   Size: $(du -sh ${NODE_RESOURCE} 2>/dev/null | cut -f1)"
          else
            echo "⚠️ Extraction may have failed, checking structure..."
            ls -la "${NODE_RESOURCE}/" 2>/dev/null || echo "   Directory not found!"
            find src-tauri/resources/ -name "node" -o -name "node.exe" 2>/dev/null | head -5
          fi

      - name: Download bundled resources (character cards + presets)
        shell: bash
        run: |
          echo "📥 Downloading bundled resources (character cards + presets)..."

          RESOURCES_ZIP="/tmp/bundled-resources.zip"
          RESOURCES_URL="https://github.com/leigegehaha/sillytavernlauncher/releases/download/resources-v2.0.0/bundled-resources.zip"

          # Try multiple mirrors for the resources zip
          for mirror in "" "https://ghfast.top/" "https://gh.llkk.cc/"; do
            URL="${mirror}${RESOURCES_URL}"
            echo "  Trying: ${URL}"
            if curl -fsSL -o "${RESOURCES_ZIP}" "${URL}" --connect-timeout 30 --max-time 600; then
              echo "  ✅ Downloaded successfully ($(du -sh ${RESOURCES_ZIP} | cut -f1))"
              break
            fi
            echo "  ❌ Failed, trying next mirror..."
          done

          if [ ! -f "${RESOURCES_ZIP}" ] || [ ! -s "${RESOURCES_ZIP}" ]; then
            echo "⚠️ Bundled resources download failed, creating empty placeholder directories"
            mkdir -p src-tauri/resources/character-cards
            mkdir -p src-tauri/resources/presets
            exit 0
          fi

          # Extract: zip contains src-tauri/resources/character-cards/ and src-tauri/resources/presets/
          echo "📦 Extracting bundled resources..."
          unzip -qo "${RESOURCES_ZIP}" -d .

          # Verify extraction
          CARDS_COUNT=$(find src-tauri/resources/character-cards -type f -name "*.png" 2>/dev/null | wc -l)
          PRESETS_COUNT=$(find src-tauri/resources/presets -type f -name "*.json" 2>/dev/null | wc -l)

          if [ "${CARDS_COUNT}" -gt 0 ]; then
            echo "✅ Character cards: ${CARDS_COUNT} PNG files extracted"
          else
            echo "⚠️ No character card PNGs found"
          fi

          if [ "${PRESETS_COUNT}" -gt 0 ]; then
            echo "✅ Presets: ${PRESETS_COUNT} JSON files extracted"
          else
            echo "⚠️ No preset JSONs found"
          fi

          echo "📋 Resource directory listing:"
          du -sh src-tauri/resources/*/ 2>/dev/null || echo "   (empty)"

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Tavern Deepseek Launcher v__VERSION__'
          releaseBody: |
            🚀 国内用户高速下载：ghfast.top 加速通道
            💡 把下方文件链接前缀替换为 https://ghfast.top/ 即可
            🔁 备用代理：https://ghproxy.cc/ https://gh.llkk.cc
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
